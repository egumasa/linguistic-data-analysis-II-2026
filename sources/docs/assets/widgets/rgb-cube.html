<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RGB colour space</title>
<style>
  html,body{margin:0;padding:0;background:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  /* The widget is standalone, so it carries its own copy of the palette
     variables it uses. Values match assets/css/slide-forest.scss. */
  :root{
    --surface:    #FFFFFF;
    --ink:        #232A26;
    --ink-soft:   #59615A;
    --primary-70: #AFCDBE;
    --primary-80: #C9DED3;
    --accent:     #A8802E;
    --accent-30:  #7E5F16;
    --accent-95:  #F8F1DE;
  }
</style>
</head>
<body>
<style>
.rgbdemo{display:flex;gap:1.2rem;align-items:center;justify-content:center;flex-wrap:wrap;margin:.3rem 0 .5rem}
.rgbdemo svg{width:20rem;max-width:46vw;touch-action:none;cursor:grab;user-select:none}
.rgbdemo svg:active{cursor:grabbing}
.rgbdemo .panel{display:flex;flex-direction:column;gap:.7rem;align-items:center}
.rgbdemo .sliders{display:grid;grid-template-columns:auto 1fr 2.6rem;gap:.4rem .6rem;align-items:center;width:17rem}
.rgbdemo .chan{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:.8em}
.rgbdemo .chan.r{color:#C62828}.rgbdemo .chan.g{color:#2E7D32}.rgbdemo .chan.b{color:#1565C0}
.rgbdemo input[type=range]{width:100%;height:1rem;cursor:pointer}
.rgbdemo input.r{accent-color:#C62828}.rgbdemo input.g{accent-color:#2E7D32}.rgbdemo input.b{accent-color:#1565C0}
.rgbdemo .num{font-family:ui-monospace,Menlo,monospace;font-size:.85em;text-align:right;color:var(--ink)}
.rgbdemo .readout{display:flex;align-items:center;gap:.7rem}
.rgbdemo .swatch{width:4.2rem;height:4.2rem;border-radius:.6rem;border:2px solid var(--primary-70);
  box-shadow:0 2px 10px rgba(0,0,0,.12)}
.rgbdemo .vec{font-family:ui-monospace,Menlo,monospace;font-size:1em;font-weight:700;color:var(--ink)}
.rgbdemo .hex{font-family:ui-monospace,Menlo,monospace;font-size:.75em;color:var(--ink-soft)}
.rgbnear{display:flex;gap:.45rem;justify-content:center;flex-wrap:wrap;font-size:.6em}
.rgbnear .chip{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.3rem .45rem;
  border:1.5px solid var(--primary-80);border-radius:.5rem;background:var(--surface);min-width:4.8rem}
.rgbnear .chip.near{border-color:var(--accent);background:var(--accent-95)}
.rgbnear .dot{width:1.3rem;height:1.3rem;border-radius:.3rem;border:1px solid var(--primary-70)}
.rgbnear .nm{color:var(--ink)}
.rgbnear .d{font-family:ui-monospace,Menlo,monospace;color:var(--ink-soft)}
.rgbnear .chip.near .d{color:var(--accent-30);font-weight:700}
</style>

<div class="rgbdemo" data-prevent-swipe>
  <svg id="rgb-cube" viewBox="0 0 350 290" aria-label="RGB colour cube"></svg>
  <div class="panel">
    <div class="sliders">
      <span class="chan r">R</span><input class="r" type="range" min="0" max="255" value="214" id="rgb-r"><span class="num" id="rgb-rv">214</span>
      <span class="chan g">G</span><input class="g" type="range" min="0" max="255" value="93"  id="rgb-g"><span class="num" id="rgb-gv">93</span>
      <span class="chan b">B</span><input class="b" type="range" min="0" max="255" value="60"  id="rgb-b"><span class="num" id="rgb-bv">60</span>
    </div>
    <div class="readout">
      <div class="swatch" id="rgb-swatch"></div>
      <div>
        <div class="vec" id="rgb-vec">[214, 93, 60]</div>
        <div class="hex" id="rgb-hex">#D65D3C</div>
      </div>
    </div>
  </div>
</div>

<div class="rgbnear" id="rgb-near"></div>

<script>
(function () {
  var REF = [
    {name:"tomato",   v:[255, 99, 71]},
    {name:"gold",     v:[255,215,  0]},
    {name:"forest",   v:[ 34,139, 34]},
    {name:"sky",      v:[135,206,235]},
    {name:"plum",     v:[221,160,221]},
    {name:"charcoal", v:[ 54, 69, 79]}
  ];
  var AXCOL = ["#C62828", "#2E7D32", "#1565C0"];
  var S = 145, CX = 175, CY = 146, D = 3.4;   // scale, centre, viewing distance
  var yaw = 0.62, pitch = 0.32;

  // 8 cube corners, and the 12 edges joining corners that differ on one channel.
  var CORNERS = [], EDGES = [];
  [0,255].forEach(function (r) { [0,255].forEach(function (g) { [0,255].forEach(function (b) {
    CORNERS.push([r,g,b]);
  }); }); });
  CORNERS.forEach(function (a, i) {
    CORNERS.forEach(function (b, j) {
      if (j <= i) return;
      var diff = 0;
      for (var k = 0; k < 3; k++) if (a[k] !== b[k]) diff++;
      if (diff === 1) EDGES.push([i, j]);
    });
  });

  function proj(p) {                       // [r,g,b] 0-255 → screen x/y plus depth
    var x = p[0]/255 - 0.5, y = p[1]/255 - 0.5, z = p[2]/255 - 0.5;
    var ca = Math.cos(yaw), sa = Math.sin(yaw);
    var x1 =  x*ca + z*sa, z1 = -x*sa + z*ca;
    var cb = Math.cos(pitch), sb = Math.sin(pitch);
    var y1 = y*cb - z1*sb, z2 = y*sb + z1*cb;
    var k = D / (D - z2);
    return { x: CX + x1*S*k, y: CY - y1*S*k, z: z2 };
  }
  function rgb(v){ return "rgb(" + v[0] + "," + v[1] + "," + v[2] + ")"; }
  function hex(n){ return n.toString(16).padStart(2,"0").toUpperCase(); }
  function dist(a,b){
    var dr=a[0]-b[0], dg=a[1]-b[1], db=a[2]-b[2];
    return Math.sqrt(dr*dr + dg*dg + db*db);
  }
  function line(a, b, col, w, extra) {
    return '<line x1="'+a.x.toFixed(1)+'" y1="'+a.y.toFixed(1)+
           '" x2="'+b.x.toFixed(1)+'" y2="'+b.y.toFixed(1)+
           '" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" '+(extra||"")+'/>';
  }
  function dot(p, r, fill, stroke, sw) {
    return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+r+
           '" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
  }

  function init() {
    var svg = document.getElementById("rgb-cube");
    if (!svg || svg.dataset.ready) return;
    svg.dataset.ready = "1";

    var ids    = ["r","g","b"].map(function (c) { return document.getElementById("rgb-"+c); });
    var nums   = ["r","g","b"].map(function (c) { return document.getElementById("rgb-"+c+"v"); });
    var swatch = document.getElementById("rgb-swatch");
    var vecEl  = document.getElementById("rgb-vec");
    var hexEl  = document.getElementById("rgb-hex");
    var nearEl = document.getElementById("rgb-near");

    nearEl.innerHTML = REF.map(function (c) {
      return '<div class="chip">' +
             '<div class="dot" style="background:' + rgb(c.v) + '"></div>' +
             '<div class="nm">' + c.name + '</div>' +
             '<div class="d">0</div></div>';
    }).join("");
    var chips = Array.prototype.slice.call(nearEl.children);

    function draw(v, nearest) {
      var P = CORNERS.map(proj);
      var items = [];                       // {z, s} — sorted back-to-front before drawing

      EDGES.forEach(function (e) {
        var a = CORNERS[e[0]], b = CORNERS[e[1]], pa = P[e[0]], pb = P[e[1]];
        var z = (pa.z + pb.z) / 2;
        var far = (a[0]+a[1]+a[2] === 0) ? b : (b[0]+b[1]+b[2] === 0) ? a : null;
        var col = "#8A938C", w = 1;
        if (far) { col = AXCOL[far.indexOf(255)]; w = 2.6; }   // the three axes from black
        var op = (0.25 + 0.6 * (z + 0.9) / 1.8).toFixed(2);
        items.push({ z: z, s: line(pa, pb, col, w, 'opacity="' + op + '"') });
      });

      // Where the colour sits: walk R, then G, then B out from the black corner.
      var steps = [[0,0,0], [v[0],0,0], [v[0],v[1],0], [v[0],v[1],v[2]]].map(proj);
      for (var i = 0; i < 3; i++) {
        items.push({ z: (steps[i].z + steps[i+1].z) / 2 + 0.001,
                     s: line(steps[i], steps[i+1], AXCOL[i], 2.2,
                             'stroke-dasharray="5 3" opacity="0.95"') });
      }

      CORNERS.forEach(function (c, i) {
        items.push({ z: P[i].z, s: dot(P[i], 3.2, rgb(c), "#7A827C", 0.8) });
      });
      REF.forEach(function (c, i) {
        var p = proj(c.v);
        items.push({ z: p.z, s: dot(p, i === nearest ? 6 : 4.5, rgb(c.v),
                                    i === nearest ? "#A8802E" : "#FFFFFF",
                                    i === nearest ? 2.2 : 1.5) });
      });

      var pv = steps[3], pn = proj(REF[nearest].v);
      items.push({ z: (pv.z + pn.z) / 2,
                   s: line(pv, pn, "#A8802E", 1.4, 'stroke-dasharray="2 3" opacity="0.85"') });
      items.push({ z: pv.z + 0.002, s: dot(pv, 9, rgb(v), "#232A26", 2) });

      items.sort(function (a, b) { return a.z - b.z; });
      svg.innerHTML = items.map(function (it) { return it.s; }).join("");
    }

    function update() {
      var v = ids.map(function (el) { return +el.value; });
      nums.forEach(function (el, i) { el.textContent = v[i]; });
      swatch.style.background = rgb(v);
      vecEl.textContent = "[" + v.join(", ") + "]";
      hexEl.textContent = "#" + v.map(hex).join("");
      var ds = REF.map(function (c) { return dist(v, c.v); });
      var best = ds.indexOf(Math.min.apply(null, ds));
      chips.forEach(function (chip, i) {
        chip.classList.toggle("near", i === best);
        chip.lastElementChild.textContent = ds[i].toFixed(0);
      });
      draw(v, best);
    }
    ids.forEach(function (el) { el.addEventListener("input", update); });

    var dragging = false, lastX = 0, lastY = 0;
    svg.addEventListener("pointerdown", function (e) {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      if (svg.setPointerCapture) svg.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    svg.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      yaw   += (e.clientX - lastX) * 0.011;
      pitch += (e.clientY - lastY) * 0.011;
      pitch  = Math.max(-1.35, Math.min(1.35, pitch));
      lastX = e.clientX; lastY = e.clientY;
      update();
    });
    ["pointerup","pointercancel"].forEach(function (ev) {
      svg.addEventListener(ev, function () { dragging = false; });
    });

    update();
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
