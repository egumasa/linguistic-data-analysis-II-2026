<section id="$idprefix$title-slide" class="center quarto-title-block"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
$if(kicker)$
  <p class="kicker">$kicker$</p>
$endif$
  <h1 class="title">$title$</h1>
$if(subtitle)$
  <p class="subtitle">$subtitle$</p>
$endif$
  <div class="title-meta">
$for(author)$
    <p class="author">$author$</p>
$endfor$
$for(institute)$
    <p class="institute">$institute$</p>
$endfor$
$if(date)$
    <p class="date">$date$</p>
$endif$
  </div>
</section>
