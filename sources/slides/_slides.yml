# Shared reveal.js config for all session slide decks.
# Referenced from each deck via `metadata-files: [_slides.yml]`.
# Theme = slides-v2 (shared layout/component rules) + slide-forest (palette only).
author: "Masaki EGUCHI, Ph.D."
institute: "Tohoku University · Summer 2026"
date-modified: last-modified
lang: en
highlight-style: github
code-annotations: hover

footer: "Linguistic Data Analysis II"
format:
  revealjs:
    # NOTE: theme is set PER DECK ([default, slides-v2.scss, slide-<flavor>.scss]),
    # not here — metadata-files load LAST in Quarto's theme cascade, so a theme in
    # this shared file would override each deck's chosen flavor.
    # Custom title slide (adds the .kicker eyebrow from each deck's `kicker:` field).
    template-partials:
      - title-slide.html
    background-transition: none
    slide-number: true
    chalkboard: true
    controls: true
    progress: true
    hash: true
    history: false
    keyboard: true
    overview: true
    touch: true
    loop: false
    rtl: false
    fragments: true
    resource-embed: true
    help: true
    showNotes: false
    autoSlide: 0
    autoSlideStoppable: true
    mouseWheel: false
    hideAddressBar: true
    previewLinks: false
    math:
      method: mathjax
      url: "https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-AMS_HTML-full"
